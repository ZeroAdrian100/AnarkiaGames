# Perfil de tests: H2 en memoria en lugar de SQL Server.
# Las migraciones de Flyway usan T-SQL, así que aquí Hibernate crea el esquema desde las entidades.
spring.datasource.url=jdbc:h2:mem:anarkiagames;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

