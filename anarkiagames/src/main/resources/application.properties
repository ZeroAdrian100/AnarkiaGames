spring.application.name=anarkiagames
# Sin SPRING_PROFILES_ACTIVE se usa el perfil dev. Para producción: SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

spring.datasource.url=${URL_DATABASE}
spring.datasource.username=${USER_DATABASE}
spring.datasource.password=${PASSWORD_DATABASE}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway crea y modifica las tablas (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Una BD creada antes de Flyway se registra como version 1 y solo recibe las migraciones siguientes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

culqi.secret_key=${CULQI_SECRET_KEY:}
payment.gateway=${PAYMENT_GATEWAY:mock}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh.expiration=604800000
jwt.reset.expiration=900000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Administrador inicial: se crea al arrancar si ambos valores existen y no hay ningun ADMIN.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}

# Tamaño máximo de página en los listados paginados del panel admin.
spring.data.web.pageable.max-page-size=100

# Actuator: solo /actuator/health, sin detalles internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El health de correo abriría una conexión SMTP en cada consulta.
management.health.mail.enabled=false

# Correo (Gmail con contraseña de aplicación). Sin MAIL_USERNAME, los correos se escriben en el log.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL del frontend, para los enlaces de los correos.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

server.port=8080
